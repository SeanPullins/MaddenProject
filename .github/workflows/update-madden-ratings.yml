name: Update Madden Ratings

on:
  workflow_dispatch:
  schedule:
    - cron: '23 */6 * * *'
  push:
    paths:
      - 'scripts/update-madden-ratings.mjs'
      - '.github/workflows/update-madden-ratings.yml'

permissions:
  contents: write

concurrency:
  group: update-madden-ratings
  cancel-in-progress: false

jobs:
  update-ratings:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        run: npm install

      - name: Pull latest Madden ratings
        env:
          MADDEN_RATINGS_API_URL: ${{ secrets.MADDEN_RATINGS_API_URL }}
        run: node scripts/update-madden-ratings.mjs

      - name: Commit rating feed if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add public/data/madden-ratings.json
          if git diff --cached --quiet; then
            echo "No Madden rating changes detected."
          else
            git commit -m "Update Madden ratings"
            git pull --rebase origin main
            git push
          fi
